stages: [lint, deploy]

variables:
  DEPLOY_HOST: "192.168.101.253"
  DEPLOY_USER: "mokulanis"

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck scripts/*.sh mdns-aliases.sh

nginx-config:
  stage: lint
  image: nginx:1.27-alpine
  script:
    - rm -f /etc/nginx/conf.d/default.conf
    - cp nginx/conf.d/*.conf /etc/nginx/conf.d/
    - mkdir -p /etc/nginx/snippets && cp nginx/snippets/*.conf /etc/nginx/snippets/
    - nginx -t

deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    # data/ holds live state and is never synced.
    - rsync -az --delete --exclude data/ --exclude .git/ ./ "$DEPLOY_USER@$DEPLOY_HOST:homelab/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd homelab && ./scripts/install.sh'
