networks:
  homelab:
    name: homelab

volumes:
  portainer_data:
  gitea_data:
  woodpecker_server_data:
  netdata_config:
  netdata_lib:
  netdata_cache:
  redis_data:
  registry_data:

services:
  # ---------------------------------------------------------------------------
  # nginx - reverse proxy. Routes *.homelab.local (server_name) to containers.
  # mDNS names are published on the host by the homelab-mdns systemd service
  # (see setup-host.sh / mdns-aliases.sh) as A records -> host LAN IP.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    # nginx starts last, after every upstream it proxies to. It re-resolves
    # container IPs at runtime via the Docker resolver (00-proxy.conf), so this
    # is not strictly required, but it makes nginx come up once the backends exist.
    depends_on:
      - homepage
      - portainer
      - dozzle
      - netdata
      - gitea
      - woodpecker-server
      - filebrowser
      - archivebox
      - registry
      - registry-ui
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Homepage - start dashboard at http://homelab.local
  # ---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homelab.local,localhost
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Portainer - Docker management  (portainer.homelab.local)
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    # Preset the admin password (min 12 chars) so there is no first-run wizard,
    # no setup-token, and no "timed out for security" lockout to race against.
    command: -H unix:///var/run/docker.sock --admin-password-file /run/portainer_pw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./data/portainer/admin_password:/run/portainer_pw:ro
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Dozzle - live container log viewer  (logs.homelab.local)
  # ---------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Gitea - git server + OAuth provider for Woodpecker  (gitea.homelab.local)
  # SSH on host port 2222.
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      GITEA__server__DOMAIN: gitea.local
      GITEA__server__ROOT_URL: http://gitea.local/
      GITEA__server__SSH_DOMAIN: gitea.local
      GITEA__server__SSH_PORT: "2222"
      GITEA__database__DB_TYPE: sqlite3
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2222:22"
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Woodpecker CI - server  (ci.homelab.local)
  # extra_hosts: the container must reach Gitea by the same name the browser uses
  # (OAuth). host-gateway routes traffic to host:80 -> nginx -> Gitea.
  # ---------------------------------------------------------------------------
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    restart: unless-stopped
    environment:
      WOODPECKER_HOST: http://ci.local
      WOODPECKER_OPEN: "true"
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: http://gitea.local
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET}
    extra_hosts:
      - "gitea.local:host-gateway"
    volumes:
      - woodpecker_server_data:/var/lib/woodpecker
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Woodpecker CI - agent (runs the pipelines). gRPC to the server on :9000
  # ---------------------------------------------------------------------------
  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    restart: unless-stopped
    depends_on: [woodpecker-server]
    command: agent
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_MAX_WORKFLOWS: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # File Browser - web file manager  (files.homelab.local)  login: admin/admin
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      - ./data/files:/srv
      - ./data/filebrowser/database:/database
      - ./data/filebrowser/config:/config
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # ArchiveBox - web page archive  (archive.homelab.local)
  # ---------------------------------------------------------------------------
  archivebox:
    image: archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    command: server --quick-init 0.0.0.0:8000
    environment:
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: http://archive.local
      PUBLIC_INDEX: "True"
      PUBLIC_SNAPSHOTS: "True"
    volumes:
      - ./data/archivebox:/data
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Netdata - host monitoring  (netdata.homelab.local)
  # ---------------------------------------------------------------------------
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    hostname: homelab
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Docker Registry (registry.homelab.local) - push needs insecure-registries!
  # ---------------------------------------------------------------------------
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "[http://registry-ui.local]"
    volumes:
      - registry_data:/var/lib/registry
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Registry UI  (registry-ui.homelab.local)
  # ---------------------------------------------------------------------------
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    restart: unless-stopped
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: Homelab Registry
      DELETE_IMAGES: "true"
      NGINX_PROXY_PASS_URL: http://registry:5000
    networks: [homelab]

  # ---------------------------------------------------------------------------
  # Redis - reachable inside the homelab network as "redis:6379" and on host :6379
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [homelab]
