# http-context helpers (conf.d/*.conf is included inside the http block).

# Map for WebSocket/SSE Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker embedded DNS - lets us use variables in proxy_pass so nginx
# re-resolves container IPs at runtime (survives container restarts).
resolver 127.0.0.11 valid=30s ipv6=off;
