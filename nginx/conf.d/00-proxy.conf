# http-context helpers (conf.d/*.conf is included inside the http block).

# Map for WebSocket/SSE Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Podman (aardvark-dns) on the homelab network gateway - lets us use variables in
# proxy_pass so nginx re-resolves container IPs at runtime (survives restarts).
resolver 10.90.0.1 valid=30s ipv6=off;
