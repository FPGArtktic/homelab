# One server block per service. Single-label .local names so every mDNS client
# (incl. Linux nss-mdns) resolves them without /etc/hosts. Served on host :8080.
# proxy_pass uses a variable so the Podman resolver (00-proxy.conf) is used at runtime.
# Registry is not proxied here: it is GitLab's built-in registry on host :5050.

server {
    listen 80 default_server;
    server_name homelab.local;
    location / {
        set $up http://homepage:3000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name portainer.local;
    location / {
        set $up http://portainer:9000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name logs.local;
    location / {
        set $up http://dozzle:8080;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name netdata.local;
    location / {
        set $up http://netdata:19999;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name gitlab.local;
    client_max_body_size 0;      # git pushes and large artifacts
    location / {
        set $up http://gitlab:80;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name files.local;
    client_max_body_size 0;      # unlimited uploads
    location / {
        set $up http://filebrowser:8080;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name archive.local;
    client_max_body_size 0;
    location / {
        set $up http://archivebox:8000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name forgejo.local;
    client_max_body_size 512M;   # git pushes
    location / {
        set $up http://forgejo:3000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name info.local;
    root /var/www/info;          # static homelab overview, see site/index.html
    index index.html;
}

server {
    listen 80;
    server_name grafana.local;
    location / {
        set $up http://grafana:3000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name microdash.local;
    location / {
        set $up http://mikrodash:3081;   # Socket.IO: proxy.conf carries the Upgrade headers
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}
