# One server block per service. Single-label .local names so every mDNS client
# (incl. Linux nss-mdns) resolves them without /etc/hosts.
# proxy_pass uses a variable so the Docker resolver (00-proxy.conf) is used.

server {
    listen 80 default_server;
    server_name homelab.local;
    location / {
        set $up http://homepage:3000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name portainer.local;
    location / {
        set $up http://portainer:9000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name logs.local;
    location / {
        set $up http://dozzle:8080;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name netdata.local;
    location / {
        set $up http://netdata:19999;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name gitea.local;
    client_max_body_size 512M;   # git pushes over HTTP
    location / {
        set $up http://gitea:3000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name ci.local;
    location / {
        set $up http://woodpecker-server:8000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name files.local;
    client_max_body_size 0;      # unlimited uploads
    location / {
        set $up http://filebrowser:80;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name archive.local;
    client_max_body_size 0;
    location / {
        set $up http://archivebox:8000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name registry.local;
    client_max_body_size 0;      # required: docker push large layers
    chunked_transfer_encoding on;
    location / {
        set $up http://registry:5000;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name registry-ui.local;
    location / {
        set $up http://registry-ui:80;
        proxy_pass $up;
        include /etc/nginx/snippets/proxy.conf;
    }
}
